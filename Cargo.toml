[package]
name = "fretforge"
version = "1.6.0"
edition = "2021"
license = "MIT"
description = "Native Rust Guitar Pro to Clone Hero chart studio"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
xml-rs = "0.8"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png"] }
rodio = { version = "0.20.1", default-features = false }

[profile.release]
opt-level = 2
strip = true
